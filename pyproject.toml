[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairbench"
version = "0.1.0"
description = "Vendor-neutral AI benchmark for laptop CPU / GPU / NPU (Intel vs AMD)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fairbench" }]
keywords = ["benchmark", "ai", "npu", "onnxruntime", "openvino", "intel", "amd", "laptop"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Benchmark",
]

# Select one ORT distribution per platform: these wheels share an import path.
dependencies = [
    "qrcode>=8.2",
    "numpy>=1.26",
    "onnx>=1.16",
    "vulkan>=1.3.275.1,<2; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "onnxruntime-directml>=1.18; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "onnxruntime>=1.20; sys_platform == 'darwin'",
    "onnxruntime>=1.18; sys_platform != 'win32' or platform_machine != 'AMD64'",
    "openvino>=2024.4; platform_machine == 'AMD64' or platform_machine == 'x86_64'",
]

[project.optional-dependencies]
# Compatibility aliases; these runtimes are included on supported platforms.
openvino = ["openvino>=2024.4; platform_machine == 'AMD64' or platform_machine == 'x86_64'"]
directml = ["onnxruntime-directml>=1.18; sys_platform == 'win32' and platform_machine == 'AMD64'"]
# CUDA and vendor NPU wheels belong in separate interpreters because they
# overwrite the same onnxruntime package. Use setup-gpu --cuda / FAIRBENCH_PYTHON.

[project.scripts]
fairbench = "fairbench.cli:main"

[project.urls]
Homepage = "https://github.com/example/fairbench"
Issues = "https://github.com/example/fairbench/issues"

# --------------------------------------------------------------------------
# Development / packaging. PEP 735 groups, understood by uv and pip 25+.
# --------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "ruff>=0.6",
]

[tool.uv]
default-groups = ["dev"]
# Runtime packages follow OS/architecture markers; discovery queries installed
# runtimes at execution time. Frozen builds explicitly exclude OpenVINO.

# --------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["fairbench*"]
namespaces = false

[tool.setuptools.package-data]
fairbench = ["web/*", "*.ps1", "*.json", "shaders/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
