<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fairbench · スマホで測る</title>
<link rel="stylesheet" href="/mobile.css">
</head>
<body>
<main>
  <header><span class="brand">fairbench</span><span class="badge">スマホで測る</span></header>
  <h1>スマホのカメラで読み取るだけ</h1>
  <ol><li>スマホをPCと同じWi-Fiに接続する。</li><li>QRコードをカメラで読み取る。</li><li>開いた画面で「この端末を計測する」を押す。</li></ol>
  <div class="qr-cards"><!-- QR_CODES --></div>
  <p>このPCは起動したままにしてください。QRコードが複数ある場合は、スマホから接続できるものを使用してください。</p>
  <details><summary>つながらない場合</summary><p>PCとスマホが同じWi-Fiか、Windowsのプライベートネットワークでアプリの通信が許可されているか確認してください。ネットワークを変更したら、このページを再読み込みします。</p></details>
  <p><a href="/mobile">このPCのブラウザで計測する →</a></p>
</main>
</body>
</html>
